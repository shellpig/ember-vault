# Room Worker: hosts the SQLite-backed Durable Object class `Room` (one instance per room).
# Pages Functions cannot define Durable Object classes, so the class lives here and Pages binds to it
# (see ../../wrangler.toml [[durable_objects.bindings]]). See docs/p5-setup.md.
name = "ember-vault-room"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Not publicly reachable: no routes, no workers.dev subdomain. Only the Pages project can call it through its binding.
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# P6 trades: the Room DO reads and writes both characters + the `trades` row in one D1 batch. Same database as the
# Pages project (wrangler.toml); the Worker does not own migrations, `npm run db:migrate:*` applies them from the root.
[[d1_databases]]
binding = "DB"
database_name = "ember-vault-db"
database_id = "75d9a4a6-43b8-4364-b095-227a05ac20e5"

# The free plan only supports SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
