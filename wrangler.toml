name = "ember-vault"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# D1 binding used by Pages Functions (env.DB).
# Replace database_id with the id printed by `wrangler d1 create ember-vault-db`.
# See docs/p1-setup.md.
[[d1_databases]]
binding = "DB"
database_name = "ember-vault-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Public (non-secret) config. The Google OAuth client id is visible to every browser anyway.
# Served to the frontend via GET /api/config and used as `aud` when verifying ID tokens.
[vars]
GOOGLE_CLIENT_ID = "560217897916-1mdabk4m44qvtrc6hluu64khvc4hoh35.apps.googleusercontent.com"
